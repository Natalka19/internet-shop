<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Internet Shop</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container mt-4">
      <h2 class="mb-3">Internet Shop</h2>

      <!-- Search -->
      <div class="input-group mb-3">
        <input
          type="text"
          id="searchInput"
          class="form-control"
          placeholder="Search product ..."
        />

        <button
          class="btn sort-btn dropdown-toggle"
          type="button"
          id="sortMenuButton"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          Sort by
        </button>

        <button
          class="btn add-btn"
          id="addProductBtn"
          type="button"
          data-bs-toggle="modal"
          data-bs-target="#addNewModal"
        >
          Add item
        </button>

        <ul class="dropdown-menu" aria-labelledby="sortMenuButton">
          <li>
            <a class="dropdown-item" href="#" onclick="sortProducts('name')"
              >Name</a
            >
          </li>
          <li>
            <a class="dropdown-item" href="#" onclick="sortProducts('category')"
              >Category</a
            >
          </li>
          <li>
            <a
              class="dropdown-item"
              href="#"
              onclick="sortProducts('price-asc')"
              >Lowest price</a
            >
          </li>
          <li>
            <a
              class="dropdown-item"
              href="#"
              onclick="sortProducts('price-desc')"
              >Highest price</a
            >
          </li>
        </ul>
      </div>

      <!-- Products table -->
      <table id="shopTable" class="table table-striped">
        <thead>
          <tr>
            <th style="width: 10%">Image</th>
            <th style="width: 15%">Name</th>
            <th style="width: 15%">Category</th>
            <th style="width: 15%">Color</th>
            <th style="width: 15%">Price</th>
            <th style="width: 10%">Stock</th>
            <th style="width: 20%">Actions</th>
          </tr>
        </thead>
        <tbody id="productsBody"></tbody>
      </table>

      <!-- Total price -->
      <div class="mt-3">
        <strong>Total price:</strong>
        <span id="totalPrice">0</span>$
      </div>
    </div>

    <div
      class="modal fade"
      id="addNewModal"
      tabindex="-1"
      aria-labelledby="addNewModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addNewModalLabel">Add New Item</h5>
            <button
              type="button"
              class="cross"
              data-bs-dismiss="modal"
              aria-label="Close"
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="modal-body">
            <form id="addNewForm" novalidate>
              <div class="mb-3">
                <label for="customerName" class="form-label"
                  >Name<span>*</span></label
                >
                <input
                  type="text"
                  class="form-control"
                  id="customerName"
                  autocomplete="off"
                />
              </div>
              <div class="mb-3">
                <label for="product" class="form-label"
                  >Product Category<span>*</span></label
                >
                <select class="form-select" id="product" autocomplete="off">
                  <option value="" selected disabled>Choose category</option>
                  <option value="TV & Video">TV & Video</option>
                  <option value="Cell Phones & Accessories">
                    Cell Phones & Accessories
                  </option>
                  <option value="Vacuum & Floor Care">
                    Vacuum & Floor Care
                  </option>
                  <option value="Home & Kitchen">Home & Kitchen</option>
                  <option value="Personal Care">Personal Care</option>
                  <option value="Large Appliances">Large Appliances</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="itemColor" class="form-label"
                  >Color<span>*</span></label
                >
                <input
                  type="text"
                  class="form-control"
                  id="color"
                  autocomplete="off"
                />
              </div>
              <div class="mb-3">
                <label for="price" class="form-label"
                  >Price<span>*</span></label
                >
                <input
                  type="number"
                  class="form-control"
                  id="price"
                  autocomplete="off"
                />
              </div>
              <div class="mb-3">
                <label for="stock" class="form-label"
                  >Stock<span>*</span></label
                >
                <input
                  type="number"
                  class="form-control"
                  id="stock"
                  autocomplete="off"
                />
              </div>
              <div class="mb-3">
                <label for="image" class="form-label">Photo (optional)</label>
                <input
                  type="file"
                  class="form-control"
                  id="image"
                  accept="image/*"
                />
                <div id="imagePreview" style="margin-top: 10px">
                </div>
                <button
                  type="button"
                  id="removeImageBtn"
                  class="btn btn-sm btn-secondary mt-2"
                >
                  Remove image
                </button>
              </div>

              <button type="submit" class="submitBtn" id="saveBtn">
                Submit
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>

    <script src="main-page.js"></script>
  </body>
</html>
